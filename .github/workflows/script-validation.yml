name: Script Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-ci-scripts:
    name: Python CI Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test release artifact validator
        run: python Scripts/CI/test_release_artifact_validation.py
      - name: Generate dependency inventory
        run: python Scripts/CI/generate_dependency_inventory.py
      - name: Upload script reports
        uses: actions/upload-artifact@v6
        with:
          name: script-validation-reports
          path: Build/Reports/**
